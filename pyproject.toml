[project]
name = "anagram-agent"
version = "0.1.0"
description = "An A2A agent that generates anagrams using Gemini"
requires-python = ">=3.13"

dependencies = [
    "fastapi[all]>=0.115.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "google-generativeai>=0.8.3"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"